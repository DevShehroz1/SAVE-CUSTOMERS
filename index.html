    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      body {
        overflow-x: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background-color: #fffad2;
      }
      .sc-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #fffad2;
      }
      .sc-header-outer {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        padding: 0 24px;
        box-sizing: border-box;
        width: 100%;
        pointer-events: none;
      }
      .sc-header {
        max-width: 960px;
        margin: 0 auto;
        height: 72px;
        padding: 0 32px;
        border-radius: 999px;
        background: linear-gradient(120deg, #004734, #47bf5d, #81d490);
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-sizing: border-box;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(16px);
        color: #ffffff;
        pointer-events: auto;
      }
      .sc-header-left {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .sc-logo {
        height: 28px;
        width: auto;
        display: block;
      }
      .sc-nav {
        display: flex;
        align-items: center;
        gap: 32px;
        font-size: 16px;
        font-weight: 500;
      }
      .sc-nav a {
        text-decoration: none;
        color: inherit;
        position: relative;
        opacity: 0.9;
      }
      .sc-nav a:hover {
        opacity: 1;
      }
      .sc-nav a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -6px;
        width: 0;
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        transition: width 0.2s ease-out;
      }
      .sc-nav a:hover::after {
        width: 100%;
      }
      .sc-header-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .sc-cta {
        padding: 6px 12px;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        background-image: linear-gradient(
          135deg,
          #003023 0%,
          #20572a 50%,
          #285741 100%
        );
        box-shadow: 0 8px 18px rgba(0, 71, 46, 0.25);
        transition: transform 0.15s ease-out, box-shadow 0.15s ease-out,
          filter 0.15s ease-out;
      }
      .sc-cta:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(0, 71, 46, 0.3);
        filter: brightness(1.03);
      }
      .sc-cta:active {
        transform: translateY(0);
        box-shadow: 0 6px 12px rgba(0, 71, 46, 0.25);
      }
      .sc-content {
        flex: 1;
        margin-top: 80px;
      }

      /* SaveCustomer customizations */
      a.button.w-button,
      .button.w-button,
      .w-button {
        background-image: linear-gradient(
          135deg,
          #003023 0%,
          #20572a 50%,
          #285741 100%
        ) !important;
        background-color: transparent !important;
        border-radius: 14px !important;
        color: #ffffff !important;
      }

      a.button.w-button *,
      .button.w-button *,
      .w-button * {
        color: #ffffff !important;
      }

      .text-pink-badge,
      [style*="#D757F5"],
      [style*="#d757f5"] {
        color: #4ABF5F !important;
      }

      body,
      p,
      .paragraph,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      .heading-style-h1,
      .heading-style-h2,
      .heading-style-h3,
      .heading-style-h4,
      .heading-style-h5,
      .heading-style-h6 {
        color: #004734 !important;
      }

      .text-pink-badge {
        color: #4ABF5F !important;
      }

      .sc-hero-microcopy {
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.5;
        color: #004734;
        opacity: 0.9;
        flex-basis: 100%;
        text-align: center;
      }

      a.button.w-button.savecustomer-primary-cta {
        background-image: none !important;
        background-color: #c1f7c9 !important;
        color: #004734 !important;
        border-radius: 14px !important;
      }

      section.section.bg-cream-secondary .button-group {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        text-align: center;
      }

      /* Mobile layout for header pill */
      @media (max-width: 640px) {
        .sc-header-outer {
          top: 16px;
          padding: 0;
        }

        .sc-header {
          max-width: 340px;
          height: 46px;
          padding: 0 18px;
        }

        .sc-logo {
          height: 16px;
        }

        .sc-nav {
          gap: 12px;
          font-size: 14px;
        }

        .sc-nav a {
          display: none;
        }

        .sc-nav a:nth-child(2) {
          display: inline-block;
        }

        .sc-cta {
          padding: 6px 12px;
          font-size: 13px;
          box-shadow: 0 6px 14px rgba(0, 71, 46, 0.25);
        }

        .sc-content {
          margin-top: 72px;
        }
      }
